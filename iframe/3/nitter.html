<!DOCTYPE html>
<title>Content from Nitter</title>
<style>body{margin:0}iframe{border:0;height:100vh;width:100%}</style>
<script>
((document, window) =>
{
	const m = /^#(\d+)(?:#host=([^#]+))(?:#theme=([^#]+))?/.exec(window.location.hash);
	if (!m)
	{
		return;
	}

	const id = m[1],
		host = m[2]  || 'nitter.net',
		theme = m[3] || 'auto',
		iframe = /** @type {!HTMLIFrameElement} */ (document.createElement('iframe'));
	iframe.scrolling = 'no';
	iframe.dataset['theme'] = theme;

	let height, lastHeight, port;
	window.onmessage = (e) =>
	{
		if (e.data === 's9e:init:3' && !port)
		{
			port = e.ports[0];

			// Display the iframe only after the parent has given the go-ahead.
			// Visiting the page on GitHub directly will only display a blank page
			iframe.src = '//' + host + '/user/' + id + '/embed';
			document.body.append(iframe);
		}
		else if (e.source === iframe.contentWindow)
		{
			height = +e.data.height;
		}

		if (height !== lastHeight)
		{
			port.postMessage({ 'method': 'resize', 'height': height });
			lastHeight = height;
		}
	};
})(document, window);
</script>
