<!DOCTYPE html>
<title>Content from Nitter</title>
<style>body{margin:0}iframe{border:0;height:100vh;width:100%}</style>
<script>
// Reference: https://github.com/zedeus/nitter/wiki/Embeds-guide
((document, window) =>
{
	const m = /^#(\d+)(?:#host=([-\w.]+))?(?:#theme=(black|dracula|mastodon|twitter(?:_dark)?))?/.exec(window.location.hash);
	if (!m)
	{
		return;
	}

	const defaultTheme = 'twitter' + (window.matchMedia('(prefers-color-scheme:dark)').matches ? '-dark' : ''),
		id = m[1],
		host = m[2]  || 'nitter.net',
		theme  = m[3] || defaultTheme,
		iframe = /** @type {!HTMLIFrameElement} */ (document.createElement('iframe'));
	iframe.scrolling = 'no';

	let height = 0, lastHeight = 0, port;
	window.onmessage = (e) =>
	{
		if (e.data === 's9e:init' && !port)
		{
			port = e.ports[0];

			// Display the iframe only after the parent has given the go-ahead.
			// Visiting the page on GitHub directly will only display a blank page
			iframe.src = '//' + host + '/user/status/' + id + '/embed?theme=' + theme;
			document.body.append(iframe);
		}
		else if (e.source === iframe.contentWindow && Array.isArray(e.data) && e.data[0] === 'resizeIframe')
		{
			height = +e.data[1]['h'] || 0;
		}

		if (height !== lastHeight && height > 150)
		{
			port.postMessage(height);
			lastHeight = height;
		}
	};
})(document, window);
</script>
